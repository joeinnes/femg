<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daily iron or magnesium supplement reminder">
  <title>Element of the Day</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --fg: #f0ede8;
      --accent: #c8b89a;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Mono', monospace;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
    }

    #element {
      font-size: clamp(3rem, 18vw, 9rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
      animation: appear 0.4s ease both;
    }

    #meta {
      font-size: 0.75rem;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      animation: appear 0.4s 0.15s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="element"></div>
  <div id="meta"></div>
  <script>
    const today = new Date();
    const epoch = new Date(2000, 0, 1);
    const days = Math.floor((today - epoch) / 86400000);
    const isEven = days % 2 === 0;

    document.getElementById('element').textContent = isEven ? 'Iron' : 'Magnesium';
    document.getElementById('meta').textContent = today.toLocaleDateString(
      'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }
    );

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
